name: 버그
description: 재현 가능한 문제와 기대 동작을 정리한다.
title: "[Bug] "
labels: ["fix"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      description: 어떤 문제가 발생했는지 간단히 작성한다.
      placeholder: 예) draft 글이 공개 블로그 목록에 노출된다.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 같은 문제를 다시 확인할 수 있는 절차를 작성한다.
      placeholder: |
        1. draft: true인 글을 추가한다.
        2. /blog로 이동한다.
        3. 목록에 draft 글이 보이는지 확인한다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상이라면 어떻게 동작해야 하는지 작성한다.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 확인한 결과를 작성한다.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 수정 검증 기준
      description: 수정 후 실행할 검증 명령이나 화면 확인을 작성한다.
      placeholder: |
        - npm run lint
        - npm run type-check
        - npm run build
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 추가 정보
      description: 로그, 스크린샷, 관련 파일, 의심 지점이 있으면 작성한다.
    validations:
      required: false
