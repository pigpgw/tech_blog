name: 문서/기록
description: README, docs, 블로그 글, AI 활용 기록 작업을 정리한다.
title: "[Docs] "
labels: ["docs"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 어떤 문서나 기록을 왜 수정하는지 작성한다.
      placeholder: 예) GitHub 이슈/PR 운영 기준을 README와 AGENTS.md에 반영한다.
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: 대상 문서
      description: 수정할 문서나 글 경로를 작성한다.
      placeholder: |
        - README.md
        - AGENTS.md
        - docs/02-ai-usage-log.md
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: 변경 내용
      description: 추가, 수정, 삭제할 내용을 작성한다.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 검증 기준
      description: 문서 검증에 필요한 최소 확인을 작성한다.
      placeholder: |
        - npm run format:check
        - 링크와 경로가 실제로 맞는지 확인
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 참고 / 메모
      description: 관련 이슈, 결정 사항, 참고 링크가 있으면 작성한다.
    validations:
      required: false
